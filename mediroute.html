<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MediRoute</title>
<style>
:root{--bg:#f3f6f9;--cd:#fff;--tx:#1b2b3b;--mt:#6b7a8a;--bd:#e1e7ee;--sb:#0f2a47;--tl:#2f8f8a;--ok:#2e8b57;--wn:#d9922b;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1420;--cd:#142234;--tx:#e6edf5;--mt:#93a4b6;--bd:#243448;--sb:#09182a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1420;--cd:#142234;--tx:#e6edf5;--mt:#93a4b6;--bd:#243448;--sb:#09182a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:var(--sb);color:#fff;padding:16px 10px}
.lg0{font-weight:700;font-size:19px;padding:4px 10px}.lg0 i{color:#5fc4bd;font-style:normal}aside small{display:block;padding:0 10px 14px;color:#9fb3c8;font-size:11px}
#nav button{display:flex;gap:10px;width:100%;background:none;border:0;color:#c9d6e3;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}#nav button.on,#nav button:hover{background:rgba(255,255,255,.13);color:#fff}
main{padding:0 20px 24px;min-width:0}header{display:flex;align-items:center;gap:10px;padding:14px 0;flex-wrap:wrap}header h1{font-size:20px;margin:0;flex:1}
.sim{background:#fff3d6;color:#7a5a12;padding:3px 10px;border-radius:99px;font-size:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}h3{margin:0 0 10px;font-size:14px}h4{margin:12px 0 6px}
.g6{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.g6 .c{margin:0}.kp small{color:var(--mt)}.kp b{display:block;font-size:24px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}.g2 .c{margin:0}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px}.g4 div{font-size:12px;color:var(--mt)}.g4 b{display:block;font-size:18px;color:var(--tx)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mt);font-size:12px}th[data-a]{cursor:pointer}.tw{overflow-x:auto}
.b{background:var(--tl);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}.b.g{background:var(--bd);color:var(--tx)}.b.r{background:var(--er)}.b.s{padding:3px 10px;font-size:12px}
.bd{color:#fff;border-radius:99px;padding:2px 9px;font-size:11px;white-space:nowrap}.pb{background:var(--bd);height:8px;border-radius:9px;overflow:hidden;min-width:70px}.pb i{display:block;height:100%;background:var(--tl)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar h3{margin:0;flex:1}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}
.mo{display:none;position:fixed;inset:0;background:rgba(5,15,30,.55);z-index:9;align-items:center;justify-content:center;padding:16px}.mo.open{display:flex}.md{background:var(--cd);border-radius:14px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mt)}.fg .ck{flex-direction:row;align-items:center;color:var(--tx)}
.op{display:flex;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}.op.no{opacity:.6}.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.er{color:var(--er)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dl div{font-size:12px;color:var(--mt)}.dl b{display:block;font-size:14px;color:var(--tx)}
.tl{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tl span{padding:4px 10px;border-radius:99px;background:var(--bd);font-size:12px}.tl .on{background:var(--tl);color:#fff}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.cp{border:0;border-radius:10px;padding:8px;cursor:pointer;color:#fff;font:inherit;font-weight:600}.cp small{display:block;font-weight:400;font-size:10px}
.Available{background:var(--ok)}.Reserved{background:var(--wn)}.Occupied{background:#3b6ea5}.Maintenance{background:#8a97a6}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row span{width:130px;font-size:12px}.row .pb{flex:1}.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dn{display:flex;gap:16px;align-items:center}.lg{font-size:12px;margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.em{padding:30px;text-align:center;color:var(--mt)}.nt{color:var(--mt);font-size:12px}.code{font:600 18px monospace;letter-spacing:2px}.ct{background:var(--er);color:#fff;border-radius:99px;padding:0 6px;font-size:11px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0f2a47;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:20;max-width:90vw;pointer-events:none}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{padding:8px}#nav{display:flex;overflow-x:auto}#nav button{width:auto;white-space:nowrap}.fg,.dl{grid-template-columns:1fr}}
</style></head><body>
<div id="app"><aside><div class="lg0">Medi<i>Route</i></div><small>Smarter Prescription Distribution for Northern Communities<br>Marathon, Ontario</small><div id="nav"></div></aside>
<main><header><h1 id="ttl"></h1><span class="sim">Simulated demonstration data · Marathon, ON</span><button class="b g" id="bell" data-a="go" data-i="ale"></button><button class="b g" data-a="rst">Reset demo</button></header><div id="main"></div></main></div>
<div class="mo" id="modal"><div class="md" id="mb"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=id=>document.getElementById(id);
const K='mediroute-v2',ZONES=['Downtown','Harbour','Rural East','Penn Lake','Hemlo Dr'],APPROVED={Downtown:1,Harbour:1,'Penn Lake':1};
const ST=['Pending','Preparing','Ready for dispatch','In transit','Ready for pickup','Delivered','Cancelled'];
const SC={Pending:'#8a97a6',Preparing:'#d9922b','Ready for dispatch':'#7a5fb5','In transit':'#3b6ea5','Ready for pickup':'#2f8f8a',Delivered:'#2e8b57',Cancelled:'#c0392b'};
const M={home:'Home delivery',locker:'Smart locker',drone:'Drone'},MC={home:'#3b6ea5',locker:'#2f8f8a',drone:'#d9922b'},COST={home:14.5,locker:6.2,drone:11.8},TGT={home:90,locker:60,drone:40};
const DF=['Pending','Preparing','Ready for dispatch','In transit','Delivered'],FL={home:DF,locker:['Pending','Preparing','Ready for pickup','Delivered'],drone:DF};
const OPEN=['Pending','Preparing','Ready for dispatch','In transit'],ACT=OPEN.concat('Ready for pickup'),FIN=['Delivered','Cancelled'];
const ZP={Downtown:[195,160],Harbour:[115,200],'Rural East':[375,95],'Penn Lake':[300,150],'Hemlo Dr':[215,65]},HUB=[170,135],LP={A:[205,125],B:[270,128]};
const DS=['Available','Preparing','In flight','Returning','Charging','Grounded'],LC={ok:'var(--ok)',warn:'var(--wn)',info:'var(--tl)'};
const NAMES=['Avery Lindqvist','Noor Haddad','Marcus Tran','Elise Moreau','Jonah Whitfield','Priya Nair','Tomás Alvarez','Hannah Kowalski','Callum Reid','Mei Zhang','Declan Boyle','Sofia Petrov'];
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const fd=t=>new Date(t).toLocaleDateString('en-CA',{month:'short',day:'numeric'}),ft=t=>new Date(t).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opt=(o,s)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${s==k?'selected':''}>${v}</option>`).join('');
const bdg=s=>`<span class="bd" style="background:${SC[s]}">${s}</span>`;
function seedData(){seed=7;const now=Date.now(),D=864e5,T=['home','locker','drone'];
const customers=NAMES.map((n,i)=>({id:'C-'+(101+i),name:n,zone:ZONES[i%5],pref:T[i%3],status:i==11?'Inactive':'Active'}));
const drivers=[{id:'D1',name:'R. Gagnon',veh:'Van MR-01',avail:true},{id:'D2',name:'S. Matthews',veh:'Van MR-02',avail:true},{id:'D3',name:'L. Okafor',veh:'Van MR-03',avail:false}];
const lockers=[{id:'A',name:'Locker A – Downtown, Peninsula Rd area (proposed)',temp:4.6,ok:true},{id:'B',name:'Locker B – Penn Lake area (proposed)',temp:5.1,ok:true}];
const comps=[];lockers.forEach(l=>{for(let i=1;i<=12;i++)comps.push({id:l.id+'-'+(i<10?'0':'')+i,lk:l.id,st:'Available',code:'',did:''})});comps[3].st='Maintenance';
const drones=[{id:'DR-1',st:'Available',bat:92,did:''},{id:'DR-2',st:'In flight',bat:64,did:'RX-1036'},{id:'DR-3',st:'Charging',bat:28,did:''}];
const del=[];for(let i=0;i<34;i++){const c=customers[i%11],m=T[Math.floor(rnd()*3)],x=rnd()<.07;del.push({id:'RX-'+(1000+i),cid:c.id,cust:c.name,zone:c.zone,m,date:now-Math.floor(rnd()*85)*D-rnd()*D,st:x?'Cancelled':'Delivered',res:'',mins:Math.round(TGT[m]*(.6+rnd()*.6)),cost:+(COST[m]*(.9+rnd()*.2)).toFixed(2),kg:.5,ctrl:false,eta:''})}
const act=(i,c,m,st,res,eta)=>del.unshift({id:'RX-'+(1034+i),cid:customers[c].id,cust:customers[c].name,zone:customers[c].zone,m,date:now-36e5*(i+1),st,res,mins:0,cost:COST[m],kg:.6,ctrl:false,eta});
act(0,0,'home','In transit','D1',ft(now+25*6e4));act(1,1,'locker','Ready for pickup','A-02','');act(2,3,'drone','In transit','DR-2',ft(now+12*6e4));act(3,5,'home','Preparing','D2','');
Object.assign(comps[1],{st:'Occupied',did:'RX-1035',code:'482913'});
return{customers,drivers,lockers,comps,drones,deliveries:del,nid:1038,wx:{wind:14,vis:10,rain:false,appr:true},notes:[{t:'Drone battery warning',m:'DR-3 at 28%, charging',l:'warn',ts:now-72e5,read:false},{t:'Driver availability',m:'L. Okafor is off duty',l:'info',ts:now-54e5,read:false},{t:'Locker maintenance',m:'Compartment A-04 out of service',l:'warn',ts:now-36e5,read:false}]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.deliveries)S=seedData();
let V='dash',MR=null,F={q:'',m:'',s:'',sk:'date',sd:-1,cq:'',ar:'all',am:'',mp:{home:1,locker:1,drone:1}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=E('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2800)};
function notify(t,m,l){S.notes.unshift({t,m,l:l||'info',ts:Date.now(),read:false});S.notes=S.notes.slice(0,40)}
const wxOk=()=>S.wx.wind<=25&&!S.wx.rain&&S.wx.vis>=5;
const wxWhy=()=>[S.wx.wind>25&&'wind '+S.wx.wind+' km/h',S.wx.rain&&'precipitation',S.wx.vis<5&&'visibility '+S.wx.vis+' km'].filter(Boolean).join(', ');
const load=id=>S.deliveries.filter(d=>d.m=='home'&&d.res==id&&OPEN.includes(d.st)).length;
const flt=z=>Math.round(Math.hypot(ZP[z][0]-HUB[0],ZP[z][1]-HUB[1])/7)+6;
const rl=d=>d.res?(d.m=='home'?((S.drivers.find(x=>x.id==d.res)||{}).name||d.res):d.res):'—';
const code=()=>String(Math.floor(100000+Math.random()*900000));
const mp=D=>['home','locker','drone'].map(m=>({l:M[m],v:D.filter(d=>d.m==m).length,c:MC[m]}));
const otm=m=>{const l=S.deliveries.filter(d=>d.m==m&&d.st=='Delivered');return l.length?Math.round(l.filter(d=>d.mins<=TGT[m]).length/l.length*100):0};
function dchk(z,k,x,dr){return[{n:'Weather',ok:wxOk(),w:'Weather unsuitable ('+wxWhy()+')'},{n:'Regulatory approval (hypothetical)',ok:!!S.wx.appr,w:'No regulatory approval in place'},{n:'Approved landing point',ok:!!APPROVED[z],w:'No approved landing point in '+z},{n:'Payload ≤ 2.5 kg',ok:k<=2.5,w:'Payload '+k+' kg exceeds 2.5 kg'},{n:'Medication class',ok:!x,w:'Controlled substances are not drone-eligible'},{n:'Drone availability',ok:!!dr,w:'No drone available with ≥ 40% battery'}]}
function elig(m,z,kg,cx){if(m=='home'){const d=S.drivers.find(d=>d.avail&&load(d.id)<4);return d?{ok:1,res:d.id,msg:'Driver '+d.name+' available ('+load(d.id)+'/4 active)'}:{ok:0,msg:'No driver available'}}
if(m=='locker'){const c=S.comps.find(c=>c.st=='Available'&&S.lockers.find(l=>l.id==c.lk).ok);return c?{ok:1,res:c.id,msg:'Compartment '+c.id+' is free'}:{ok:0,msg:'No compartments available'}}
const dr=S.drones.find(d=>d.st=='Available'&&d.bat>=40),bad=dchk(z,kg,cx,dr).filter(x=>!x.ok);return bad.length?{ok:0,msg:bad.map(b=>b.w).join('; ')}:{ok:1,res:dr.id,msg:'Drone '+dr.id+' ('+dr.bat+'%): weather, route, payload and approval checks passed'}}
function claim(d){if(d.m=='locker'){const c=S.comps.find(c=>c.id==d.res);c.st='Reserved';c.did=d.id}if(d.m=='drone'){const r=S.drones.find(x=>x.id==d.res);r.st='Preparing';r.did=d.id}}
function freeR(d){if(d.m=='locker'){const c=S.comps.find(c=>c.id==d.res);if(c&&c.did==d.id){c.st=c.st=='Maintenance'?'Maintenance':'Available';c.code='';c.did=''}}
if(d.m=='drone'){const r=S.drones.find(x=>x.id==d.res);if(r&&r.did==d.id){r.did='';r.st=r.bat<30?'Charging':'Available';if(r.bat<30)notify('Drone battery warning',r.id+' at '+r.bat+'%, charging','warn')}}}
function fin(d){d.mins=Math.round(TGT[d.m]*(.55+Math.random()*.6));d.cost=+(COST[d.m]*(.92+Math.random()*.16)).toFixed(2);d.eta='';
if(d.m=='drone'){const r=S.drones.find(x=>x.id==d.res);if(r)r.bat=Math.max(5,r.bat-14)}freeR(d);notify('Delivery completed',d.id+' delivered via '+M[d.m]+' in '+d.mins+' min','ok')}
function adv(id){const d=S.deliveries.find(x=>x.id==id),f=FL[d.m],i=f.indexOf(d.st);if(i<0||i>=f.length-1)return;const n=f[i+1];
if(d.m=='drone'&&n=='In transit'){const bad=dchk(d.zone,d.kg,d.ctrl,1).filter(c=>!c.ok);if(bad.length){notify('Dispatch blocked',d.id+': '+bad.map(b=>b.w).join('; '),'warn');save();render();return toast('Dispatch blocked: '+bad[0].w)}}
d.st=n;if(n=='Ready for pickup'){const c=S.comps.find(c=>c.id==d.res);if(c){c.st='Occupied';c.code=code();notify('Locker ready',d.id+' placed in '+c.id+'; pickup code issued (simulated)')}}
if(n=='In transit'){d.eta=ft(Date.now()+(d.m=='drone'?flt(d.zone):45)*6e4);if(d.m=='drone'){const r=S.drones.find(x=>x.id==d.res);if(r)r.st='In flight'}}
if(n=='Delivered')fin(d);save();render()}
const ref=()=>{if(MR&&E('modal').classList.contains('open'))MR()};
function modal(t,h,r){E('mb').innerHTML='<h3>'+t+'</h3>'+h;E('modal').classList.add('open');MR=r||null}
const closeM=()=>{E('modal').classList.remove('open');MR=null},err=m=>{E('err').textContent=m},done=m=>{save();closeM();render();toast(m)};
function bars(o,c){const mx=Math.max(1,...o.map(x=>x.v)),w=300/o.length;return'<svg viewBox="0 0 300 130" width="100%">'+o.map((x,i)=>{const h=x.v/mx*90;return`<rect x="${i*w+w*.2}" y="${105-h}" width="${w*.6}" height="${h}" rx="4" fill="${c||'#2f8f8a'}"/><text x="${i*w+w/2}" y="${99-h}" text-anchor="middle" font-size="10" fill="var(--tx)">${x.v}</text><text x="${i*w+w/2}" y="122" text-anchor="middle" font-size="10" fill="var(--mt)">${x.l}</text>`}).join('')+'</svg>'}
function donut(p){const t=p.reduce((a,x)=>a+x.v,0)||1;let off=0;return'<div class="dn"><svg viewBox="0 0 100 100" width="120"><g transform="rotate(-90 50 50)">'+p.map(x=>{const l=x.v/t*251.3,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${x.c}" stroke-width="16" stroke-dasharray="${l} ${251.3-l}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('')+'</g></svg><div>'+p.map(x=>`<div class="lg"><i style="background:${x.c}"></i>${x.l}: <b>${x.v}</b></div>`).join('')+'</div></div>'}
function monthly(D){const n=new Date(),o=[];for(let i=3;i>=0;i--){const x=new Date(n.getFullYear(),n.getMonth()-i,1);o.push({l:x.toLocaleString('en',{month:'short'}),k:x.getFullYear()*12+x.getMonth(),v:0})}D.forEach(d=>{const x=new Date(d.date),t=o.find(z=>z.k==x.getFullYear()*12+x.getMonth());if(t)t.v++});return o}
const prow=(l,p,c)=>`<div class="row"><span>${l}</span><div class="pb"><i style="width:${p}%;${c?'background:'+c:''}"></i></div><b>${Math.round(p)}%</b></div>`;
function dash(){const D=S.deliveries,dl=D.filter(d=>d.st=='Delivered'),k=[['Prescriptions processed',D.length],['Active deliveries',D.filter(d=>ACT.includes(d.st)).length],['Completed deliveries',dl.length],['On-time delivery rate',(dl.length?Math.round(dl.filter(d=>d.mins<=TGT[d.m]).length/dl.length*100):0)+'%'],['Locker compartments free',S.comps.filter(c=>c.st=='Available').length+' / '+S.comps.length],['Avg delivery time',(dl.length?Math.round(dl.reduce((a,d)=>a+d.mins,0)/dl.length):0)+' min']],rec=[...D].sort((a,b)=>b.date-a.date).slice(0,6);
return`<div class="g6">${k.map(([a,b])=>`<div class="c kp"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
<div class="g2"><div class="c"><h3>Monthly delivery volume</h3>${bars(monthly(D))}</div><div class="c"><h3>Delivery method distribution</h3>${donut(mp(D))}</div>
<div class="c"><h3>Delivery status breakdown</h3>${ST.map(s=>{const n=D.filter(d=>d.st==s).length;return`<div class="row"><span>${s}</span><div class="pb"><i style="width:${n/D.length*100}%;background:${SC[s]}"></i></div><b>${n}</b></div>`}).join('')}</div>
<div class="c"><h3>Recent delivery activity</h3>${rec.map(d=>`<div class="row"><span style="width:62px">${d.id}</span><span style="flex:1;width:auto">${d.cust} · ${M[d.m]}</span>${bdg(d.st)}</div>`).join('')}</div>
<div class="c"><h3>Alerts and notifications</h3>${S.notes.slice(0,4).map(n=>`<div class="row"><i class="dot" style="background:${LC[n.l]}"></i><span style="flex:1;width:auto"><b>${n.t}</b>: ${n.m}</span></div>`).join('')||'<div class="em">No alerts.</div>'}</div>
<div class="c"><h3>Delivery performance (on-time %)</h3>${['home','locker','drone'].map(m=>prow(M[m],otm(m),MC[m])).join('')}</div></div>
<div class="c" style="margin-top:14px"><h3>Two-minute demo</h3><ol><li>Click <b>New delivery</b> and pick a customer.</li><li>Compare the three options and their eligibility checks.</li><li>Choose a method and create the order.</li><li>Open it from <b>Deliveries</b> and press Advance until Delivered.</li><li>Return here: the KPIs, charts and alerts have updated.</li></ol><button class="b" data-a="new">Start: new delivery</button></div>`}
function deliv(){let L=S.deliveries.filter(d=>(!F.m||d.m==F.m)&&(!F.s||d.st==F.s)&&(!F.q||(d.id+d.cust+d.zone).toLowerCase().includes(F.q.toLowerCase())));L.sort((a,b)=>{const x=a[F.sk],y=b[F.sk];return(x>y?1:x<y?-1:0)*F.sd});

fail:i=>{const d=S.deliveries.find(x=>x.id==i);d.st='Ready for dispatch';d.eta='';notify('Failed delivery attempt',i+' returned to dispatch queue','warn');save();render();view(i)},
cx:i=>{const d=S.deliveries.find(x=>x.id==i);d.st='Cancelled';freeR(d);notify('Delivery cancelled',i+' cancelled; resources released','warn');done(i+' cancelled')},
sv:i=>{const d=S.deliveries.find(x=>x.id==i),k=+E('e-k').value;if(!(k>0&&k<=10))return err('Enter a payload between 0.1 and 10 kg.');const c=S.customers.find(x=>x.id==E('e-c').value);Object.assign(d,{cid:c.id,cust:c.name,zone:E('e-z').value,kg:k});save();render();view(i);toast('Delivery updated')},
drv:i=>{const d=S.drivers.find(x=>x.id==i)||{name:'',veh:''};pform(i?'Edit driver':'Add driver',`<div class="fg"><label>Name<input id="d-n" value="${esc(d.name)}"></label><label>Vehicle ID<input id="d-v" value="${esc(d.veh)}"></label></div>`,'svd',i)},
svd:i=>{const n=E('d-n').value.trim(),v=E('d-v').value.trim();if(n.length<2||!v)return err('Enter a driver name and vehicle ID.');if(i){Object.assign(S.drivers.find(x=>x.id==i),{name:n,veh:v})}else S.drivers.push({id:'D'+(S.drivers.length+1),name:n,veh:v,avail:true});done('Driver saved')},
tg:i=>{const d=S.drivers.find(x=>x.id==i);d.avail=!d.avail;notify('Driver availability',d.name+(d.avail?' is available':' is off duty'));save();render()},
cp,rs:i=>{const c=S.comps.find(x=>x.id==i);c.st='Reserved';notify('Locker reservation',i+' reserved');save();render();cp(i)},
rel:i=>{const c=S.comps.find(x=>x.id==i);c.st='Available';c.did='';save();render();cp(i)},
mt:i=>{const c=S.comps.find(x=>x.id==i);c.st=c.st=='Maintenance'?'Available':'Maintenance';notify('Locker status',i+(c.st=='Maintenance'?' set to maintenance':' returned to service'),'warn');save();render();cp(i)},
as:i=>{const c=S.comps.find(x=>x.id==i),d=S.deliveries.find(x=>x.id==E('as').value);const o=S.comps.find(x=>x.id==d.res&&x.did==d.id);if(o){o.st='Available';o.did='';o.code=''}d.res=i;c.st='Reserved';c.did=d.id;save();render();cp(i);toast(d.id+' assigned to '+i)},
col:i=>{const c=S.comps.find(x=>x.id==i),d=S.deliveries.find(x=>x.id==c.did);if(d)adv(d.id);else{c.st='Available';c.code='';save();render()}closeM();toast('Marked as collected')},
rc:i=>{S.comps.find(x=>x.id==i).code=code();save();cp(i);toast('New simulated pickup code issued')},
tmp:i=>{const l=S.lockers.find(x=>x.id==i);l.ok=!l.ok;l.temp=l.ok?4.8:9.6;if(!l.ok)notify('Locker temperature alert',l.name+' reading '+l.temp+' °C (range 2–8 °C); new assignments paused','warn');save();render()},
chg:i=>{const r=S.drones.find(x=>x.id==i);r.bat=Math.min(100,r.bat+25);if(r.st=='Charging'&&r.bat>=30)r.st='Available';save();render()},chk,
cus:i=>{const c=S.customers.find(x=>x.id==i)||{name:'',zone:'Central',pref:'home',status:'Active'};pform(i?'Edit customer':'Add customer',`<div class="fg"><label>Name (fictional)<input id="c-n" value="${esc(c.name)}"></label><label>Area<select id="c-z">${ZONES.map(z=>`<option ${z==c.zone?'selected':''}>${z}</option>`).join('')}</select></label><label>Preferred method<select id="c-p">${opt(M,c.pref)}</select></label><label>Status<select id="c-s"><option ${c.status=='Active'?'selected':''}>Active</option><option ${c.status=='Inactive'?'selected':''}>Inactive</option></select></label></div>`,'svc',i)},
svc:i=>{const n=E('c-n').value.trim();if(n.length<2)return err('Enter a customer name.');const o={name:n,zone:E('c-z').value,pref:E('c-p').value,status:E('c-s').value};if(i)Object.assign(S.customers.find(x=>x.id==i),o);else S.customers.push({id:'C-'+(101+S.customers.length),...o});done('Customer saved')},
hist:i=>{const c=S.customers.find(x=>x.id==i),L=S.deliveries.filter(d=>d.cid==i);modal('Delivery history · '+c.name,L.length?`<table>${L.map(d=>`<tr><td>${d.id}</td><td>${M[d.m]}</td><td>${fd(d.date)}</td><td>${bdg(d.st)}</td></tr>`).join('')}</table>`:'<div class="em">No deliveries yet.</div>')+(E('mb').insertAdjacentHTML('beforeend','<div class="mb"><button class="b g" data-a="close">Close</button></div>'),'')},
csv:()=>{const lim=F.ar=='all'?0:Date.now()-F.ar*864e5,L=S.deliveries.filter(d=>d.date>=lim&&(!F.am||d.m==F.am)),t='order_id,customer,zone,method,date,status,resource,minutes,cost_cad\n'+L.map(d=>[d.id,d.cust,d.zone,M[d.m],new Date(d.date).toISOString().slice(0,10),d.st,rl(d),d.mins,d.cost].join(',')).join('\n');modal('Export CSV (simulated data)',`<textarea id="csv" style="width:100%;height:220px;font:12px monospace;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px">${esc(t)}</textarea><div class="mb"><button class="b" data-a="copy">Copy to clipboard</button><button class="b g" data-a="close">Close</button></div>`)},
copy:()=>{const x=E('csv');x.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'CSV copied':'Select the text and copy it manually')},
clr:()=>{S.notes=[];save();render()},rst:()=>{S=seedData();save();render();toast('Demo data reset')}};
document.addEventListener('click',e=>{if(e.target.id=='modal')return closeM();const t=e.target.closest('[data-a]');if(!t||t.tagName=='SELECT'||t.tagName=='INPUT')return;const f=A[t.dataset.a];if(f)f(t.dataset.i,t)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'){F.q=t.value;render()}else if(t.id=='cq'){F.cq=t.value;render()}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a,id=t.id;
if(id=='fm'){F.m=t.value;render()}else if(id=='fs'){F.s=t.value;render()}else if(id=='ar'){F.ar=t.value;render()}else if(id=='am'){F.am=t.value;render()}
else if(id=='f-c'){setZone();optsR()}else if(id=='f-z'||id=='f-k'||id=='f-x')optsR();
else if(t.dataset.w){const w=S.wx,p=wxOk(),k=t.dataset.w;w[k]=t.type=='checkbox'?t.checked:+t.value;if(p&&!wxOk())notify('Weather restriction','Drone dispatch blocked: '+wxWhy(),'warn');if(k=='appr'&&!w.appr)notify('Regulatory check','Approval assumption removed; drone dispatch blocked','warn');save();render()}
else if(t.dataset.m){F.mp[t.dataset.m]=t.checked;render()}
else if(a=='asg'){const d=S.deliveries.find(x=>x.id==t.dataset.i),r=S.drivers.find(x=>x.id==t.value);if(!r.avail||load(r.id)>=4){toast(r.name+' is unavailable or at capacity');render();return}d.res=r.id;notify('Driver assigned',d.id+' assigned to '+r.name);save();render();toast(d.id+' assigned to '+r.name)}
else if(a=='dst'){const r=S.drones.find(x=>x.id==t.dataset.i);r.st=t.value;if(r.st=='Grounded')notify('Drone grounded',r.id+' grounded','warn');save();render()}});
render();
</script></body></html>
